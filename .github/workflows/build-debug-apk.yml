name: Build Debug APK

# Phase 1A: Build a debug APK automatically without secrets or paid services.
# Runs on pushes to feature branches and pull requests targeting develop.
# Note: `arena/**` is included because Arena agent sessions use
# `arena/<id>-lumina-android` feature branches branched from develop.

on:
  push:
    branches:
      - "feature/**"
      - "arena/**"
  pull_request:
    branches:
      - "develop"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Validate Gradle configuration
        run: ./gradlew help --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify the APK requests no permissions
        run: |
          permissions="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$permissions"
          if grep -q '^uses-permission' <<< "$permissions"; then
            echo 'The Phase 1A APK must not request permissions.' >&2
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
