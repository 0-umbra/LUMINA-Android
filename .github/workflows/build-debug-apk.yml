name: Build Debug APK

# Build a debug APK automatically without secrets or paid services.
# Runs on pushes to feature branches and pull requests targeting develop.
# Note: `arena/**` is included because Arena agent sessions use
# `arena/<id>-lumina-android` feature branches branched from develop.

on:
  push:
    branches:
      - "feature/**"
      - "arena/**"
  pull_request:
    branches:
      - "develop"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        run: |
          # Prefer the SDK bundled with the GitHub-hosted Ubuntu image.
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate Gradle configuration
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle-help.log"
          if ./gradlew help --stacktrace --console=plain 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi

          # Keep the full log and surface the Gradle error in the check annotation.
          details="$(awk '/^\* What went wrong:$/{ show=1; next } /^\* Try:$/{ show=0 } show' "$log" | tail -c 4000)"
          details="${details:-$(tail -c 4000 "$log")}"
          details="${details//%/%25}"
          details="${details//$'\r'/%0D}"
          details="${details//$'\n'/%0A}"
          printf '::error title=Gradle configuration failed::Exit status %s. %s\n' "$status" "$details"
          exit "$status"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify wallpaper APK and permissions
        run: python3 scripts/verify_wallpaper_apk.py app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/35.0.0"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
